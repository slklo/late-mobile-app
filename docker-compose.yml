services: 
  backend: 
    build: 
      context: ./backend
    container_name: lateplate-backend
    ports: 
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db: 
    image: postgres:17-alpine
    container_name: lateplate-db

    environment:
      POSTGRES_DB: lateplate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      ports: 
       - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes: 
    postgres_data: 
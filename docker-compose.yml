services: 
  backend: 
    build: ./backend
    ports: 
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db: 
        condition: service_healthy
      redis:
        condition: service_healthy

  redis: 
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [
      "redis-server", 
      "--save",
      "", 
      "--appendonly", # deaktitivert bei Redis die AOF-Persistenz
      "no",
      "--maxmemory",
      "256mb",
      "--maxmemory-policy",
      "noeviction"
    ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  db: 
    image: postgres:17-alpine
    env_file:
      - .env
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes: 
  postgres_data: 